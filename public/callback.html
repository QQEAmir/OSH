<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Signing in...</title>
<style>
  body { background: #0a0a0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: Inter, sans-serif; }
  .box { text-align: center; color: #e2e8f0; }
  .spinner { width: 48px; height: 48px; border: 3px solid #2a2a3d; border-top-color: #6c63ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #64748b; font-size: 15px; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p>Signing you in with Lark...</p>
</div>
<script>
async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (!code) { window.location.href = '/'; return; }

  try {
    const res = await fetch('/api/lark-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('osh_user', JSON.stringify({
        name: data.name,
        id: data.open_id,
        avatar: data.avatar
      }));
      window.location.href = '/';
    } else {
      window.location.href = '/';
    }
  } catch(e) {
    window.location.href = '/';
  }
}
handleCallback();
</script>
</body>
</html>
